<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>単語登録帳</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <main>
      <div class="title">
        <h1>単語登録帳</h1>

        <input id="main-title" type="text" placeholder="タイトルを書いてね" />
        <button id="add-title">追加</button>

        <div>
          <label for="text-area">ここに詳細書いてね</label>
          <textarea
            name="text-area"
            id="text-area"
            placeholder="詳細を書いてね"
            rows="5"
            cols="5"
          ></textarea>
        </div>
      </div>

      <div class="list-box">
        <h1>単語一覧</h1>
        <ul id="title-area">
          <!-- <li>
            <button id="click-text">追加されました</button
            ><input type="text" id="text-area-box" hidden />
          </li> -->
        </ul>
      </div>
      <div class="detail">
        <h1>詳細</h1>
        <label for="addtitle2">タイトル</label>
        <h2 id="addtitle2"></h2>
        <label for="add-text">詳細</label>
        <p id="add-text"></p>
      </div>
    </main>
    <script src="index.js"></script>
  </body>
</html>
